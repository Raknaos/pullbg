<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PullBG</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" />
  <link rel="stylesheet" href="./css/site.css?v=7" />
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="./index.html"><span class="mark">P</span>PullBG</a>
      <div class="nav-links">
        <span class="meter" id="quota"></span>
        <span data-auth></span>
      </div>
    </nav>
    <section class="simple">
      <div class="drop" id="drop">
        Dépose plusieurs images — ça part tout seul
        <span class="note">ou clique · Ctrl+V</span>
        <input id="file" type="file" accept="image/*" multiple hidden />
      </div>
      <div class="bar" id="actions">
        <button class="btn btn-ghost" id="zip" hidden>Tout en ZIP</button>
        <button class="btn btn-ghost" id="clear" hidden>Vider</button>
      </div>
      <div class="queue" id="queue"></div>
    </section>
  </div>
  <div class="gate" id="gate" hidden>
    <div class="gate-card">
      <h2>Aperçu bloqué</h2>
      <p id="gate-text"></p>
      <div class="hero-cta">
        <a class="btn btn-acc" id="gate-cta" href="./login.html?next=pricing">Créer un compte</a>
        <button class="btn btn-ghost" id="gate-close">Fermer</button>
      </div>
    </div>
  </div>
  <script type="module" src="./js/studio.js?v=8"></script>
</body>
</html>

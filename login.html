<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compte — PullBG</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/site.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <a class="brand" href="./index.html"><span class="mark">P</span>PullBG</a>
    <h1 style="margin-top:28px">Compte</h1>
    <p class="lead" style="color:var(--muted)">Email + mot de passe. Ensuite les offres.</p>
    <form class="form" id="form">
      <input type="email" id="email" placeholder="email" required />
      <input type="password" id="password" placeholder="mot de passe (≥ 6)" required minlength="6" />
      <button class="btn btn-acc" type="button" id="signup">Créer un compte</button>
      <button class="btn btn-ghost" type="submit">J’ai déjà un compte</button>
      <p class="err" id="err"></p>
    </form>
  </div>
  <script type="module">
    import { login, signup } from "./js/auth.js";
    const next = new URLSearchParams(location.search).get("next") || "pricing";
    const err = document.getElementById("err");
    async function go(fn, afterSignup) {
      err.textContent = "";
      try {
        await fn(document.getElementById("email").value, document.getElementById("password").value);
        location.href = afterSignup ? "./pricing.html?from=signup" : (next === "pricing" ? "./pricing.html" : "./app.html");
      } catch (e) { err.textContent = e.message; }
    }
    document.getElementById("form").addEventListener("submit", (e) => { e.preventDefault(); go(login, false); });
    document.getElementById("signup").addEventListener("click", () => go(signup, true));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offres — StudioCut</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" />
  <link rel="stylesheet" href="./css/site.css?v=14" />
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="./index.html"><span class="mark">S</span>StudioCut</a>
      <div class="nav-links">
        <a href="./app.html">Studio</a>
        <span data-auth></span>
      </div>
    </nav>
    <section class="prices-hero">
      <h1>Continuer.</h1>
      <p class="lead" id="lead" style="color:var(--muted);max-width:36ch">10 images / jour, avec un compteur. Ou sans limite.</p>
      <p class="meter" id="meter"></p>
    </section>
    <section class="prices">
      <article class="card">
        <h3>Mensuel</h3>
        <div class="price">2,99 € <small>/ mois</small></div>
        <ul>
          <li>Sans limite</li>
          <li>Studio + ZIP</li>
          <li>Annulable</li>
        </ul>
        <button class="btn btn-ghost" data-plan="monthly">2,99 € / mois</button>
      </article>
      <article class="card hl">
        <h3>Annuel</h3>
        <div class="price">19,99 € <small>/ an</small><span class="was">29,99 €</span></div>
        <ul>
          <li>Sans limite</li>
          <li>1,67 € / mois</li>
          <li>Un paiement</li>
        </ul>
        <button class="btn btn-acc" data-plan="yearly">19,99 € / an</button>
      </article>
    </section>
  </div>
  <script type="module">
    import { currentUser, setPlan, paintNav, quota, quotaLabel } from "./js/auth.js";
    if (!currentUser()) location.replace("./app.html");
    paintNav();
    if (new URLSearchParams(location.search).get("from") === "signup") {
      document.getElementById("lead").textContent = "Compte créé. 10 images / jour — le compteur indique le prochain lot. Ou sans limite.";
    }
    document.getElementById("meter").textContent = quotaLabel(quota());
    document.querySelectorAll("[data-plan]").forEach((btn) => {
      btn.addEventListener("click", () => {
        setPlan(btn.dataset.plan);
        location.href = "./account.html";
      });
    });
  </script>
</body>
</html>

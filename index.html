<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PullBG — Supprimez le fond d'une image</title>
  <meta name="description" content="Supprimez le fond d'une image, 100 % automatique, dans le navigateur." />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800&display=swap" />
  <link rel="stylesheet" href="./css/site.css?v=56" />
</head>
<body>
  <nav class="nav">
    <a class="brand" href="./index.html"><span class="mark">P</span>PullBG</a>
    <div class="nav-links">
      <span class="meter" id="quota"></span>
      <span data-auth></span>
    </div>
  </nav>
  <section class="rb-hero">
    <h1>Supprimez le fond d’une image</h1>
    <p class="sub">100 % automatique</p>
    <div class="rb-card" id="stage">
      <div id="empty">
        <span class="upload">Téléchargez une image</span>
        <p class="hint">ou déposez un fichier, collez une image</p>
        <span class="note">plusieurs images d’un coup</span>
      </div>
      <div class="rb-preview" id="preview" hidden>
        <img id="result" alt="" />
      </div>
      <input id="file" type="file" accept="image/*" multiple hidden />
    </div>
    <div class="rb-actions">
      <a class="btn btn-acc" id="dl" hidden download>Télécharger</a>
      <button class="btn btn-ghost" id="zip" hidden>Tout en ZIP</button>
      <button class="btn btn-ghost" id="clear" hidden>Vider</button>
    </div>
    <div class="rb-film" id="queue"></div>
  </section>
  <div class="gate" id="gate" hidden>
    <div class="gate-card">
      <h2>Aperçu bloqué</h2>
      <p id="gate-text"></p>
      <div class="hero-cta">
        <a class="btn btn-acc" id="gate-cta" href="./login.html?next=pricing">Créer un compte</a>
        <button class="btn btn-ghost" id="gate-close">Fermer</button>
      </div>
    </div>
  </div>
  <script type="module" src="./js/studio.js?v=68"></script>
</body>
</html>
